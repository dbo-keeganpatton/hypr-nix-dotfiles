
general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(255,255,255,0.9)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$USER"
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    color = rgba(255,255,255,0.6)
    position = 0, 150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255,255,255,0.2)
    inner_color = rgba(255,255,255,0.1)
    font_color = rgba(255,255,255,1.0)
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    rounding = 12
    position = 0, -50
    halign = center
    valign = center
}

